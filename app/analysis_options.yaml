include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Every phase must end with zero warnings, so warnings are errors here
    # rather than a note somebody promises to clean up later.
    todo: ignore
    deprecated_member_use: error
    deprecated_member_use_from_same_package: error
    unused_import: error
    unused_local_variable: error
    unused_field: error
    dead_code: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unnecessary_statements
    - use_build_context_synchronously

    # Style, so diffs stay reviewable at speed
    # avoid_redundant_argument_values is NOT enabled: it fires on
    # `width: DekapSpace.borderWidth`, whose value happens to equal the Flutter
    # default today. Dropping the token reference to satisfy the lint would mean
    # a future change to borderWidth silently fails to reach those borders, and
    # docs/02 makes token references a contract.
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures

# public_member_api_docs is deliberately NOT enabled. It is meant for published
# packages: on app code it demands a doc comment on every widget constructor and
# field, which produces filler rather than clarity. Class-level docs explaining
# *why* a widget exists are required by review instead.

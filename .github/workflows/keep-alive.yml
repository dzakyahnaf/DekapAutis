name: keep-alive

# Menjaga proyek Supabase tetap hidup selama masa penjurian.
#
# Proyek free ter-pause setelah 7 hari tanpa aktivitas basis data, sementara
# penjurian berlangsung 2-11 September - sepuluh hari. Tanpa cron ini, aplikasi
# bisa padam di tengah penilaian, dan juri yang membukanya melihat kesalahan
# jaringan, bukan sebuah produk.
#
# Dijadwalkan harian, bukan mingguan: jeda tujuh hari tidak menyisakan ruang
# untuk satu kali kegagalan.

on:
  schedule:
    # Tiap tiga jam. Fungsi ini juga menggeser data demo agar berakhir "hari
    # ini" menurut WIB, jadi waktunya menentukan apakah beranda demo berisi.
    #
    # Dua kali sehari ternyata tidak cukup. Cron GitHub dijadwalkan, bukan
    # dijamin: jalan-jalan sebelumnya molor sekitar dua jam setiap kali
    # (17.05 UTC baru berjalan 19.15 UTC), dan pada antrean padat sebuah
    # jadwal bisa dilewati sama sekali. Akibatnya nyata dan terlihat - pada
    # 22 September pukul 00.10 WIB beranda demo kosong, karena tanggal WIB
    # sudah berganti sementara penggesernya belum berjalan.
    #
    #   17.05 UTC = 00.05 WIB  tepat setelah tanggal WIB berganti
    #   20.00 UTC = 03.00 WIB  menutup molornya jadwal pertama
    #   23.00 UTC = 06.00 WIB
    #   02.00 UTC = 09.00 WIB  jam-jam penjurian
    #   05.00 UTC = 12.00 WIB
    #
    # Fungsinya idempoten - panggilan kedua di hari yang sama menggeser 0,
    # jadi menambah jadwal tidak menambah risiko apa pun.
    - cron: '5 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  sentuh-basis-data:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil Edge Function keep-alive
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL atau SUPABASE_PUBLISHABLE_KEY belum diset."
            echo "Tambahkan keduanya di Settings > Secrets and variables > Actions."
            exit 1
          fi

          kode=$(curl -sS -o respons.json -w '%{http_code}' \
            --max-time 30 \
            -H "Authorization: Bearer $KEY" \
            -H "apikey: $KEY" \
            "$URL/functions/v1/keep-alive")

          echo "HTTP $kode"
          cat respons.json
          echo

          # Gagal keras. Cron yang selalu hijau tidak dapat memberi tahu siapa
          # pun bahwa basis datanya berhenti menjawab.
          if [ "$kode" != "200" ]; then
            echo "::error::keep-alive gagal dengan HTTP $kode"
            exit 1
          fi

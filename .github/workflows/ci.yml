name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # package:sqlite3 v3 loads its native library through Dart build hooks.
      # Without this the analyzer runs but `flutter test` cannot build.
      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # Includes the contrast audit and the palette scan, which are build
      # gates rather than advisory checks: a failure here means an
      # accessibility or design-system regression reached the branch.
      - name: Test
        run: flutter test --reporter expanded

  aturan-rencana:
    name: deterministic plan rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # These rules decide what a child is asked to do. They are pure functions
      # on purpose, so they can be checked here without a database, a model, or
      # a device - which is also the evidence that the model does not choose.
      - name: Test plan rules
        run: deno test --allow-import supabase/functions/_shared/pemetaan_test.ts

      # Layer 1 of the medical boundary. Both halves are asserted: nothing
      # forbidden gets through, and nothing ordinary gets refused.
      - name: Test the medical boundary lexicon
        run: deno test --allow-import supabase/functions/_shared/lexicon_test.ts

      # The report goes to a therapist who cannot tell an invented percentage
      # from a measured one. This is the check that stops one reaching them.
      - name: Test report narrative verification
        run: deno test --allow-import supabase/functions/_shared/narasi_test.ts

      - name: Type-check Edge Functions
        run: deno check --allow-import supabase/functions/ask/index.ts supabase/functions/generate-plan/index.ts supabase/functions/hapus-akun/index.ts supabase/functions/summarize-report/index.ts

  basis-data:
    name: RLS, deletion and catalogue guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      # Each script raises on failure, so a privacy or content regression cannot
      # reach a branch quietly. Port 55322 rather than the usual 54322: see
      # supabase/config.toml.
      - name: Row Level Security
        run: psql "$DB" -v ON_ERROR_STOP=1 -f scripts/test_rls.sql
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:55322/postgres

      - name: Account deletion really deletes
        run: psql "$DB" -v ON_ERROR_STOP=1 -f scripts/test_hapus_akun.sql
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:55322/postgres

      - name: Activity catalogue content limits
        run: psql "$DB" -v ON_ERROR_STOP=1 -f scripts/test_katalog.sql
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:55322/postgres

      - name: Hybrid retrieval
        run: psql "$DB" -v ON_ERROR_STOP=1 -f scripts/test_cari_potongan.sql
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:55322/postgres

  secrets:
    name: no API keys in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # KNF-03: model API keys live only in Supabase Edge Function secrets.
      # A key on the client side is a blocker-level bug, so it fails CI rather
      # than waiting to be noticed during the APK audit in F11.
      - name: Scan for key patterns
        run: |
          if grep -rEn --binary-files=without-match \
              'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}' \
              --exclude-dir=.git --exclude-dir=build --exclude-dir=.dart_tool \
              --exclude='*.md' --exclude='ci.yml' .; then
            echo "::error::Kunci API ditemukan di dalam repositori."
            exit 1
          fi
          echo "bersih"
